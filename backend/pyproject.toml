[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "codeatlas-api"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1", "uvicorn[standard]==0.35.0", "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43", "psycopg[binary]==3.2.9", "redis==6.4.0",
  "celery==5.5.3", "structlog==25.4.0"
]
[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.9"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
